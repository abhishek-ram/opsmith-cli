[project]
name = "opsmith-cli"
version = "0.6.0"
description = "Opsmith is an AI devops engineer in your terminal"
readme = {file = "README.md", content-type = "text/markdown"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python",
    "Topic :: Software Development",
]
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "ansible==14.3.1",
    "boto3==1.43.89",
    "dnspython==2.8.0",
    "gitpython==3.1.50",
    "google-api-python-client==2.200.0",
    "google-cloud-compute==1.52.0",
    "google-cloud-resource-manager==1.18.0",
    "google-cloud-storage==3.13.1",
    "grep-ast==0.9.0",
    "inquirer==3.4.1",
    "jinja2==3.1.6",
    "pydantic==2.13.5",
    "pydantic-ai-slim[anthropic,google,openai]==2.41.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "tqdm==4.68.3",
    "tree-sitter==0.25.2",
    "tree-sitter-language-pack==1.9.1",
    "typer==0.27.2",
]

[project.optional-dependencies]
logfire = ["logfire==4.16.0"]

[project.scripts]
opsmith = "opsmith.main:app"

[tool.setuptools]
include-package-data = true

[tool.hatch.build.targets.wheel]
packages = ["opsmith"]

[tool.codespell]
skip = '*.svg'
# The "T" suffix is the convention for a TypeVar; this one is not a misspelling of "account".
ignore-words-list = 'accountt'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "black==26.5.1",
    "boto3-stubs==1.43.89",
    "mypy>=2.3.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["opsmith"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "opsmith.tests.*"
disallow_untyped_defs = false

[tool.black]
line-length = 100
# Pinned to the lowest interpreter the project supports. Left to infer from requires-python
# (">=3.12"), black formats for the newest version it knows about and then cannot run its AST
# safety check on a 3.12 interpreter, so the reformat goes unverified.
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["opsmith/tests"]
python_files = ["test_*.py"]
addopts = "-q"
