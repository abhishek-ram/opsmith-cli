- name: Build and push Docker image to GCP Artifact Registry
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    # These variables are expected to be passed via --extra-vars
    # docker_path: "path/to/build/folder"
    # dockerfile_path: "Dockerfile"
    # image_name_slug: "my-service"
    # registry_url: "registry.com/my-repo"
    # image_tag_name: "latest"
    # platform: "linux/amd64"
    image_name: "{{ registry_url }}/{{ image_name_slug }}"
    image_tag: "{{ image_tag_name }}"
    registry_host: "{{ registry_url.split('/')[0] }}"
    # Opsmith's own builder. It is named on each build rather than selected with --use, so the
    # user's default builder never changes, and it is never removed, so its cache carries across
    # images and runs. The docker-container driver bundles QEMU, which is what lets a host build
    # for a machine of the other architecture without any setup.
    builder_name: "opsmith"

  tasks:
    # The last inspect covers a concurrent run that created the builder first.
    - name: Ensure the Opsmith buildx builder exists
      shell: |
        docker buildx inspect {{ builder_name }} >/dev/null 2>&1 \
          || docker buildx create --name {{ builder_name }} --driver docker-container >/dev/null \
          || docker buildx inspect {{ builder_name }} >/dev/null

    - name: "Login to GCP Artifact Registry"
      block:
        - name: Login to GCP Artifact Registry
          command: "gcloud auth configure-docker {{ registry_host }} --quiet"

      rescue:
        - name: Handle login failure
          fail:
            msg: "Failed to login to GCP Artifact Registry. Please check your credentials."

    - name: Build and push the image for the machine's platform
      shell: |
        docker buildx build \
          --builder {{ builder_name }} \
          --platform {{ platform }} \
          --file {{ dockerfile_path }} \
          --tag {{ image_name }}:{{ image_tag }} \
          --push \
          --progress=plain \
          {{ docker_path }}
      register: image_build_result

    - name: Cleanup
      block:
      - name: Logout from ECR
        community.docker.docker_login:
          registry_url: "{{ registry_host }}"
          state: absent

    - name: Print image URL
      debug:
        msg: "OPSMITH_OUTPUT_IMAGE_URL={{ image_name }}:{{ image_tag }}"
