repos:
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        args: ["--line-length", "100", "--preview"]
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args: ["--show-source"]
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli
  - repo: local
    hooks:
      - id: build-skill-refs
        name: regenerate the agent skill references
        # It regenerates rather than complaining, so a change to a command or the schema updates
        # the skill in the same commit. CI enforces it separately, through test_skill_refs.py,
        # because CI runs pytest and nothing else.
        entry: uv run python scripts/build_skill_refs.py
        language: system
        pass_filenames: false
        files: ^(opsmith/(cli|core)/|opsmith/types\.py|scripts/build_skill_refs\.py)
      - id: mypy
        name: mypy
        # Run through uv rather than mirrors-mypy: the pydantic plugin has to import the same
        # pydantic the project pins, which an isolated hook environment would not have.
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
